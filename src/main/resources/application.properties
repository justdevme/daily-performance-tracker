spring.application.name=monolith-dpt

spring.datasource.url=jdbc:postgresql://localhost:55432/dpt
spring.datasource.username=dpt
spring.datasource.password=dpt123

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false

# ===== FLYWAY =====
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=TRACE

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.prometheus.metrics.export.enabled=true

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

logging.level.org.springframework.jdbc.core=TRACE
logging.level.org.springframework.cache=TRACE

logging.file.name=./log/application.log
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=120000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=dpt::key-prefix=dpt::